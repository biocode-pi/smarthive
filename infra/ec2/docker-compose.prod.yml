services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarthive
      POSTGRES_USER: smarthive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?senha ausente}
    volumes:
      - /opt/smarthive/pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthive -d smarthive"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /opt/smarthive/app.env
    environment:
      DATABASE_URL: postgresql://smarthive:${POSTGRES_PASSWORD}@db:5432/smarthive
      DATABASE_SSLMODE: disable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - /opt/smarthive/origin.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/smarthive/sites.caddy:/etc/caddy/sites.caddy:ro
      - /opt/smarthive/caddy/data:/data
      - /opt/smarthive/caddy/config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
