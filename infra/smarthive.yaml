AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SmartHive - infraestrutura de baixo custo: Cognito (login web/mobile), S3 privado
  para midias, S3 + CloudFront para o frontend e EC2 t4g.micro com API FastAPI e
  PostgreSQL em Docker. CloudFront e a unica porta de entrada (HTTPS); a API so
  aceita trafego vindo do CloudFront.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      Projeto academico com creditos limitados. Sem RDS, NAT Gateway, ALB ou Secrets
      Manager para manter o custo perto de US$ 11/mes. Postgres roda no EC2.
    must:
      - Porta 443 aberta a internet so pela validacao do certificado (Let's Encrypt TLS-ALPN-01); o Caddy recusa com 403 requisicoes sem o cabecalho secreto do CloudFront.
      - Nao usar chaves de acesso AWS na instancia; usar a IAM Role.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC onde a instancia roda (VPC padrao da conta).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet publica da VPC (precisa suportar t4g).
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.micro, t4g.small]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Valor do cabecalho X-Origin-Verify que o CloudFront envia a origem. Fonte da
      verdade no SSM SecureString /smarthive/origin-secret (passado pelo deploy).
  OriginSecretParameterName:
    Type: String
    Default: /smarthive/origin-secret

Resources:
  # ---------------------------------------------------------------- Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Login unico para a plataforma web e o app mobile.
        must:
          - Contas de usuarios sao dados persistentes; manter Retain.
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-usuarios"
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: SmartHive - codigo de verificacao
        EmailMessage: "Seu codigo de verificacao do SmartHive e {####}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Cliente publico (SPA e mobile) sem segredo, com SRP para nao trafegar a senha.
    Properties:
      ClientName: !Sub "${AWS::StackName}-app"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------- S3
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Imagens e videos das capturas; lidos so por URL pre-assinada gerada pela API.
        must:
          - Bucket sempre privado.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expira-versoes-antigas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadsBucket.Arn
              - !Sub "${UploadsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  SiteBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Build estatico do frontend (site + plataforma); pode ser recriado a partir do repositorio.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expira-versoes-antigas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: LeituraPeloCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DeployBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Pacotes do backend enviados pelo script de deploy e baixados pela instancia via SSM.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: limpa-pacotes-antigos
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1

  DeployBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DeployBucket.Arn
              - !Sub "${DeployBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Backups diarios do Postgres (pg_dump) feitos pelo timer da instancia. O banco
          vive no disco do EC2; sem isso, substituir a instancia perde os dados.
        must:
          - Bucket sempre privado; manter Retain (e a unica copia fora da instancia).
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retencao-30-dias
            Status: Enabled
            Prefix: postgres/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- EC2 (API + Postgres)
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          TLS ponta a ponta (CloudFront -> Caddy na 443). A 443 precisa ser publica para o
          Let's Encrypt validar o certificado; requisicoes sem o cabecalho X-Origin-Verify
          recebem 403 no Caddy. Sem SSH; acesso administrativo por SSM Session Manager.
        must:
          - Nunca abrir a porta 22 nem a 80.
          - Nao remover a verificacao de X-Origin-Verify no Caddy enquanto a 443 for publica.
    Properties:
      GroupDescription: SmartHive API - HTTPS na 443 (Caddy com verificacao de origem)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS - CloudFront e validacao TLS-ALPN do Lets Encrypt
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS de saida (S3, Cognito JWKS, SSM, imagens Docker, pacotes)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP de saida (repositorios de pacotes)

  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Credenciais temporarias para a API acessar o S3 e para o SSM gerenciar a instancia.
        must:
          - Escopo minimo; sem s3:* nem buckets alheios.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: smarthive-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MidiasDosUsuarios
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${UploadsBucket.Arn}/usuarios/*"
              - Sid: PacotesDeDeploy
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DeployBucket.Arn}/*"
              - Sid: BackupsDoBanco
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${BackupBucket.Arn}/postgres/*"
              - Sid: ListarBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: postgres/*
              - Sid: SegredoDeOrigem
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OriginSecretParameterName}"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: IMDSv2 obrigatorio e creditos de CPU "standard" (evita cobranca extra do modo unlimited).
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled
        CreditSpecification:
          CpuCredits: standard
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  ApiInstance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Roda Caddy (TLS), backend e Postgres via Docker Compose; o codigo chega pelo script infra/deploy-backend.sh.
        must:
          - O volume do Postgres vive no disco da instancia; substituir a instancia apaga o banco (faca backup antes).
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-api"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          # Swap: 1 GB de RAM e pouco para Postgres + API + build da imagem.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-aarch64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p /opt/smarthive
          # Senha do Postgres gerada na propria instancia; nunca sai dela.
          if [ ! -f /opt/smarthive/db.env ]; then
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > /opt/smarthive/db.env
            chmod 600 /opt/smarthive/db.env
          fi

  ApiEip:
    Type: AWS::EC2::EIP
    Metadata:
      com.aws.cloudformation.Context:
        why: Endereco fixo para o CloudFront usar como origem mesmo apos parar/iniciar a instancia.
    Properties:
      Domain: vpc
      InstanceId: !Ref ApiInstance

  # ---------------------------------------------------------------- CloudFront
  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Rotas do React Router (/app/colmeias, /login) sem extensao devolvem o index.html.
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Reescreve rotas da SPA para /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Dominio unico com HTTPS para site, plataforma e API (/api/*), sem CORS e sem
          certificado proprio. /api usa ForwardedValues com lista de headers (inclui Authorization) para repassar
          Authorization e nao cachear respostas. A origem da API e <ip>.sslip.io (DNS publico
          gratuito que resolve para o IP) porque o Let's Encrypt nao emite para amazonaws.com.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SmartHive
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub
              - "${Dashed}.sslip.io"
              - Dashed: !Join ["-", !Split [".", !Ref ApiEip]]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              # Lista explicita: repassar "*" incluiria o Host, e o CloudFront usaria o
              # dominio *.cloudfront.net no SNI, quebrando o TLS com a origem (502).
              Headers: [Authorization, Content-Type, Accept, Origin, Range]
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UploadsBucketName:
    Value: !Ref UploadsBucket
  SiteBucketName:
    Value: !Ref SiteBucket
  DeployBucketName:
    Value: !Ref DeployBucket
  BackupBucketName:
    Value: !Ref BackupBucket
  InstanceId:
    Value: !Ref ApiInstance
  Region:
    Value: !Ref AWS::Region
